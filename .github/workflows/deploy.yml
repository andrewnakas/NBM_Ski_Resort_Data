name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - 'claude/**'
      - main
  schedule:
    # TEMPORARY: Run every 5 minutes to quickly build complete dataset
    # After 24 runs (~2 hours), change back to: '15 * * * *' for hourly updates
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore download state and cache
        uses: actions/cache@v3
        with:
          path: |
            data/cache
            data/state
          key: nbm-data-${{ github.run_id }}
          restore-keys: |
            nbm-data-

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for GRIB2 processing
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch and process NBM data
        timeout-minutes: 3
        run: |
          python scripts/fetch_nbm_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
